<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .container1 {
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .container2 {
            display: flex; /* Use flexbox to arrange divs horizontally */
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<header style="display: flex;">
    <img src="{{ url_for('static', filename='images/ro_header_logo.png') }}" alt="Logo">
    <h1>TOP INSTA CONSTRUCTION CORPORATION</h1>
</header>
<nav></nav>
    <ul class="navbar">
        <li><a href="http://127.0.0.1:5000/list_of_employees" >Employees</a></li>
        <li><a href="http://127.0.0.1:5000/add_employee" class="active">Add Employee</a></li>
        <li><a href="http://127.0.0.1:5000/dashboard">Dashboard</a></li>
        <li><a href="http://127.0.0.1:5000/logout">Logout</a></li>
    </ul>
</nav>
<body>
    <div class="container">
        <!-- <h1>Add Employee</h1> -->

        <!-- Display success or error message -->
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if daily_rate %}
            <div class="result">
                <p><strong>Employee Name:</strong> {{ employee_name }}</p>
                <p><strong>Employee Type</strong> {{ employee_type }}</p>
                <p><strong>Daily Rate:</strong> Php {{ daily_rate }}</p>
            </div>
        {% endif %}

        <!-- Payroll form -->
        <form action="/add_employee" method="POST">
            <label for="employee_name">Employee Name:</label>
            <input type="text" id="employee_name" name="employee_name" required><br>
            
            <!-- <label for="employee_type">Employee Type:</label>
            <input type="text" id="employee_type" name="employee_type" required><br> -->
            <label for="employee_type">Employee Type:</label>
            <select id="employee_type" name="employee_type">
                <option value="Staff">Staff</option>
                <option value="Worker">Worker</option>
            </select><br>

            <label for="daily_rate">Daily Rate (Php):</label>
            <input type="text" id="daily_rate" name="daily_rate" required><br><br>

            <button type="submit" style="padding: 12px 30px">Add</button>

        </form>
        <!-- <br/>
        <button onclick="window.location.href='http://127.0.0.1:5000/list_of_employees'">View Employees</button> -->
    </div>
</body>
</html>
