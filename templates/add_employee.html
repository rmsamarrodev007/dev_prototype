<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
</head>
<body>
    <h1>Add Employee</h1>
    <form method="POST">
        <label for="name">Name: </label><input type="text" name="name" required><br>
        <label for="salary">Salary: </label><input type="number" step="0.01" name="salary" required><br>
        <label for="tax_deductions">Tax Deductions: </label><input type="number" step="0.01" name="tax_deductions" required><br>
        <label for="bonus">Bonus: </label><input type="number" step="0.01" name="bonus"><br>
        <button type="submit">Add Employee</button>
    </form>
</body>
</html>
