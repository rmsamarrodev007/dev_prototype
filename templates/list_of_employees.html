<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Employees </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .container1 {
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .container2 {
            display: flex; /* Use flexbox to arrange divs horizontally */
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

<header style="display: flex;">
    <img src="{{ url_for('static', filename='images/ro_header_logo.png') }}" alt="Logo">
    <h1>TOP INSTA CONSTRUCTION CORPORATION</h1>
</header>
<nav>
    <ul class="navbar">
        <li><a href="http://127.0.0.1:5000/list_of_employees" class="active">Employees</a></li>
        <li><a href="http://127.0.0.1:5000/add_employee">Add Employee</a></li>
        <li><a href="http://127.0.0.1:5000/dashboard">Dashboard</a></li>
        <li><a href="http://127.0.0.1:5000/logout">Logout</a></li>
    </ul>
</nav>
<div class="container1">
    <table>
        <thead>
            <tr>
                <!-- <th>Employee Id</th> -->
                <th>Employee Name</th>
                <th>Type</th>
                <th>Daily Rate</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Iterate over the 'users' list and display each user in a table row -->
            {% for emp in employees %}
                <tr>
                    <td id="{{ emp[0] }}" style="display: none;">{{ emp[0] }}</td>
                    <td>{{ emp[1] }}</td>
                    <td>{{ emp[2] }}</td>
                    <td>{{ emp[4] }}</td>
                    <td>
                        <button class="addBtn" >Add Time Card</button>
                        <button class="viewBtn">View Records</button>
                        <button class="deleteBtn">Delete</button>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script>

    // Function to show a confirmation box and send POST request if confirmed
    $(".addBtn").click(function(){
        var id =  $(this).parent().parent().find('td').eq(0).html()
        // Construct the URL with the parameter
        var url = "http://127.0.0.1:5000/add_time_card_per_emp?id=" + id;  // Pass the 'id' parameter
        // Redirect to the new page with the parameter
        window.location.href = url;  // Redirect to the new page
    })
    // Function to show a confirmation box and send POST request if confirmed
    $(".viewBtn").click(function(){
        var id =  $(this).parent().parent().find('td').eq(0).html()
        // Construct the URL with the parameter
        var url = "http://127.0.0.1:5000/list_time_card_per_emp?id=" + id;  // Pass the 'id' parameter
        // Redirect to the new page with the parameter
        window.location.href = url;  // Redirect to the new page
    })
    // Function to show a confirmation box and send POST request if confirmed
    $(".deleteBtn").click(function(){
        var id =  $(this).parent().parent().find('td').eq(0).html()
        var confirmAction = confirm("Are you sure you want to delete this record?");
        // If the user confirms, send the POST request
        if (confirmAction) {
             // Send POST request to the server
             fetch('/list_of_employees', {
                method: 'POST', // HTTP method
                headers: {
                    'Content-Type': 'application/json' // Specify that we're sending JSON
                },
                body: JSON.stringify({
                    id: id  // Send the text as part of the request body
                })
            })
            .then(response => response.json()) // Parse the JSON response
            .then(data => {
                // Handle the server response
                alert("Deleted successfully!");
                location.reload();
                console.log("Server response:", data);
            })
            .catch(error => {
                // Handle any errors
                alert("Error occurred while sending data.");
                console.error("Error:", error);
            });
        } else {
            alert("Action canceled.");
        }
    })
</script>


</body>
</html>
